<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#3a0f36"><title>SHS Core Mathematics Lesson Planner — Sir Isaac Boahen</title>
<style>body{margin:0;min-height:100vh;background:linear-gradient(130deg,#381035,#6c1c62);color:#fff;font:16px/1.55 system-ui;display:grid;place-items:center}main{padding:35px;max-width:600px;text-align:center}h1{font:700 34px Georgia,serif}.spin{width:32px;height:32px;border:4px solid #ffffff66;border-top-color:#f1be46;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}button{border:0;background:#e8b83d;padding:11px 17px;border-radius:9px;cursor:pointer;font-weight:700}</style></head><body><main><h1>SHS Core Mathematics Lesson Planner</h1><p>Prepared by Sir Isaac Boahen</p><div class="spin"></div><p id="loadMsg">Loading 68 teaching weeks and assessment resources…</p><button id="retry" hidden onclick="location.reload()">Try again</button></main><script>
(async()=>{try{const paths=Array.from({length:13},(_,i)=>'parts/p'+String(i).padStart(2,'0')+'.txt');const r=await Promise.all(paths.map((p,i)=>fetch(p,{cache:i===12?'no-store':'default'})));for(let i=0;i<r.length;i++)if(!r[i].ok)throw Error('Unable to load lesson resources '+(i+1)+' (HTTP '+r[i].status+')');let html=(await Promise.all(r.map(x=>x.text()))).join('');if(!html.startsWith('<!doctype html>')||!html.includes('window.CMLP.guardExport'))throw Error('Lesson resource integrity check failed');document.open();document.write(html);document.close()}catch(e){document.getElementById('loadMsg').textContent='Unable to open the planner: '+e.message;document.querySelector('.spin').hidden=true;document.getElementById('retry').hidden=false}})();
</script></body></html>
