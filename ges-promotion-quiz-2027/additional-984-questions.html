<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GES Promotion Question Bank | Subscribers</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:16px system-ui,Arial,sans-serif;background:#eff6f1;color:#153323}.shell{max-width:540px;margin:9vh auto;padding:24px;text-align:center}.panel{background:#fff;border:1px solid #d6e7da;border-radius:20px;padding:25px 18px;box-shadow:0 12px 40px #1235}.btn{display:inline-block;margin-top:16px;padding:13px 20px;border:0;border-radius:12px;background:#006b3f;color:white;text-decoration:none;font-weight:700}.err{color:#b42318}iframe{display:block;position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:white}</style></head>
<body><div id="status" class="shell"><div class="panel"><h2>GES Promotion Question Bank</h2><p id="message">Checking your subscription securely…</p><a id="back" class="btn" href="./index.html">← Return to Practice Dashboard</a></div></div>
<script>
(async function(){
const msg=document.getElementById('message');
let token='';try{token=localStorage.getItem('promo_token_v4')||localStorage.getItem('promo_token_v3')||''}catch{}
if(!token){msg.innerHTML='Please log in through the original practice platform first.';return;}
try{
const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);
let res;try{res=await fetch('https://dhnrrruishllmnhafjdd.supabase.co/functions/v1/ges-promotion-bank-addon',{method:'GET',headers:{Authorization:'Bearer '+token},cache:'no-store',signal:controller.signal});}finally{clearTimeout(timer);}
if(!res.ok){msg.textContent=res.status===403?'This additional question bank is for approved subscribers. Please request activation from the main dashboard.':res.status===401?'Your session has expired. Please sign in again from the main dashboard.':'The new quiz is temporarily unavailable. Please try again.';msg.className='err';return;}
const html=await res.text();
if(!html.includes('id="bank"')||!html.includes('id="startBtn"'))throw Error('Question bank integrity check failed.');
const iframe=document.createElement('iframe');iframe.title='GES Promotion Question Bank — 984 Questions';iframe.setAttribute('allow','autoplay');iframe.srcdoc=html;
document.body.appendChild(iframe);document.getElementById('status').remove();
}catch(e){msg.textContent='Unable to load the question bank. Check your internet connection and open it again from your dashboard.';msg.className='err';console.error(e);}
})();
</script></body></html>
