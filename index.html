<style>
:root{--navy:#071b32;--navy2:#0b2b52;--blue:#1c6dd0;--cyan:#20b7d8;--gold:#f0b429;--green:#159957;--red:#c83a3a;--ink:#132238;--muted:#6f7d91;--line:#dbe5f0;--bg:#f1f6fb;--card:#fff;--shadow:0 16px 44px rgba(7,27,50,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Aptos,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,#e5f5ff 0,transparent 32%),var(--bg)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{max-width:1180px;margin:auto;min-height:100vh}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#071b32 0,#0b2b52 55%,#0c4c78 100%);color:#fff;padding:34px 20px 30px}
.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-80px;top:-100px;background:rgba(32,183,216,.16);box-shadow:0 0 80px rgba(32,183,216,.25)}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:14px;max-width:1100px;margin:auto}.logo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#dff4ff);color:var(--navy);font-weight:950;font-size:25px;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.brand h1{margin:0;font-size:clamp(25px,4vw,42px);letter-spacing:-.5px}.brand p{margin:5px 0 0;color:#d5e6f5}
.hero-actions{max-width:1100px;margin:20px auto 0;display:flex;gap:9px;flex-wrap:wrap;position:relative;z-index:1}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:850;background:#fff;color:var(--navy);box-shadow:0 5px 14px rgba(0,0,0,.08);transition:.18s transform,.18s box-shadow}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.12)}.btn.primary{background:linear-gradient(135deg,#1c6dd0,#20b7d8);color:#fff}.btn.green{background:#159957;color:#fff}.btn.red{background:#c83a3a;color:#fff}.btn.gold{background:#f0b429;color:#3a2a00}.btn.ghost{background:#fff;border:1px solid var(--line);box-shadow:none}.btn.dark{background:var(--navy);color:#fff}.btn.small{padding:8px 11px;font-size:13px}
.main{padding:22px}.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.panel.flat{box-shadow:none}
.welcome{display:grid;grid-template-columns:1.5fr .8fr;gap:18px;align-items:stretch}.welcome-card{background:linear-gradient(135deg,#f7fbff,#fff);border:1px solid var(--line);border-radius:18px;padding:20px}
.section-title{margin:0;color:var(--navy);font-size:24px}.sub{color:var(--muted);margin:6px 0 0;line-height:1.55}.tiny{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:17px}.course-card{position:relative;overflow:hidden;border-radius:20px;padding:20px;min-height:220px;color:#fff;box-shadow:0 16px 32px rgba(7,27,50,.14);transition:.2s transform}.course-card:hover{transform:translateY(-4px)}
.course-card:nth-child(1){background:linear-gradient(145deg,#155799,#159957)}.course-card:nth-child(2){background:linear-gradient(145deg,#5f2c82,#c83a3a)}.course-card:nth-child(3){background:linear-gradient(145deg,#8a5a00,#1c6dd0)}
.course-card:after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 38%);animation:softBlink 3.3s ease-in-out infinite;pointer-events:none}.course-card:nth-child(2):after{animation-delay:.8s}.course-card:nth-child(3):after{animation-delay:1.6s}@keyframes softBlink{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.55;transform:scale(1.05)}}
.course-icon{font-size:40px;position:relative;z-index:1}.course-card h3{font-size:24px;margin:11px 0 6px;position:relative;z-index:1}.course-card p{color:#eef7ff;line-height:1.5;position:relative;z-index:1}.course-card .btn{position:relative;z-index:1;margin-top:8px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#f7fbff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:24px;color:var(--navy)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.ok{background:#e8f8ef;color:#117844}.wait{background:#fff5d9;color:#7c5900}.bad{background:#ffeded;color:#a82929}.info{background:#eaf4ff;color:#155b9f}
.alert{border-radius:12px;padding:12px 14px;margin:12px 0;border:1px solid}.alert.info{background:#edf6ff;border-color:#c9e2ff;color:#145b9b}.alert.ok{background:#eaf8f0;border-color:#bce7cc;color:#0e6b39}.alert.warn{background:#fff7df;border-color:#f0d58a;color:#755300}.alert.err{background:#fff0f0;border-color:#efc2c2;color:#9b2a2a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:800;font-size:13px;color:#31445d;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd8e6;border-radius:12px;padding:12px;background:#fff;outline:none}.field textarea{min-height:170px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4c91d9;box-shadow:0 0 0 3px rgba(76,145,217,.13)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.quiz-list{display:grid;gap:12px;margin-top:15px}.quiz-item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.quiz-item.locked{background:#f8fafc}.quiz-item h4{margin:0;color:var(--navy);font-size:18px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:12px}
.timerbar{position:sticky;top:0;z-index:100;background:rgba(7,27,50,.97);color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.2);padding:10px 14px}.timerinner{max-width:1000px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;background:#fff;color:var(--navy);padding:8px 13px;border-radius:12px;font-size:21px;font-weight:950;min-width:110px;text-align:center}.timer.danger{background:#ffe7e7;color:#a11f1f}.quizstage{max-width:900px;margin:18px auto 80px;padding:0 14px}.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(7,27,50,.07)}.qhead{display:flex;gap:8px;align-items:center;margin-bottom:9px}.qnum{background:var(--navy);color:#fff;border-radius:9px;padding:5px 9px;font-weight:900;font-size:12px}.qtopic{font-size:12px;color:var(--muted)}.qtext{font-family:Cambria,"Times New Roman",serif;font-size:17px;line-height:1.65;font-weight:650}.choices{display:grid;gap:9px;margin-top:13px}.choice{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #cedae7;border-radius:12px;background:#fff;transition:.15s}.choice:hover{background:#f5faff;border-color:#7fb0df}.choice.selected{background:#edf6ff;border:2px solid #2675c8}.letter{flex:0 0 31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#edf2f7;font-weight:900;color:#24415d}.choice.selected .letter{background:#2675c8;color:#fff}
.script{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.script.correct{border-left:5px solid #159957}.script.wrong{border-left:5px solid #c83a3a}.script-option{padding:8px 10px;border-radius:9px;border:1px solid #e0e7ef;margin:5px 0}.script-option.mine{background:#fff7df;border-color:#ecd080}.script-option.right{background:#e9f8ef;border-color:#a9ddbd}
.scorebox{display:flex;gap:17px;align-items:center;flex-wrap:wrap;margin:12px 0}.scorecircle{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#071b32,#1c6dd0);color:#fff;font-size:28px;font-weight:950}
.progress-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.progress-card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.bar{height:10px;border-radius:999px;background:#e8eef5;overflow:hidden;margin-top:8px}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#1c6dd0,#20b7d8)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:760px;background:#fff}th,td{padding:10px;border-bottom:1px solid #e6edf5;text-align:left;font-size:13px}th{background:#f3f7fb;color:#31465e;position:sticky;top:0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#3f536c}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}
@media(max-width:800px){.course-grid,.progress-grid{grid-template-columns:1fr}.welcome{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.main{padding:13px}.panel{padding:15px}.hero{padding:24px 14px}.brand{align-items:flex-start}.logo{width:52px;height:52px}}
@media print{body{background:#fff}.hero,.no-print,.timerbar,footer{display:none!important}.main,.panel,.quizstage{padding:0;margin:0;max-width:none;box-shadow:none;border:0}.script,.progress-card{break-inside:avoid}.tablewrap{overflow:visible;border:0}table{min-width:0}th{position:static}}
</style>

<body><div id="root"></div>
<script>
const API='https://dhnrrruishllmnhafjdd.supabase.co/functions/v1/sir-isaac-quiz-hub';
const S={token:localStorage.getItem('qz_student_token')||'',student:null,settings:null,courses:[],subscription:null,course:null,attempt:null,answers:{},timer:null,adminPw:sessionStorage.getItem('qz_admin_pw')||'',admin:null,result:null};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const letters=['A','B','C','D'];
async function api(action,payload={}){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload,session_token:S.token})});
 const d=await r.json().catch(()=>({ok:false,error:'Invalid server response'}));if(!r.ok||d.ok===false)throw new Error(d.error||'Request failed');return d;
}
function typeset(){setTimeout(()=>window.MathJax?.typesetPromise?.().catch(()=>{}),40)}
function shell(body){
 $('#root').innerHTML='<div class="shell"><header class="hero"><div class="brand"><div class="logo">SI</div><div><h1>'+esc(S.settings?.app_title||'Sir Isaac Quiz Practice Hub')+'</h1><p>Smart timed practice • instant marking • personal progress</p></div></div><div class="hero-actions no-print"><button class="btn" onclick="home()">Home</button>'+(S.student?'<button class="btn" onclick="showProgress()">My Progress</button><button class="btn" onclick="showProfile()">My Account</button>':'<button class="btn" onclick="showLogin()">Student Login</button>')+'<button class="btn gold" onclick="showAdmin()">Admin</button></div></header>'+body+'<footer>Prepared for learning and continuous practice • Sir Isaac</footer></div>';typeset();
}
function money(x){return 'GH₵'+Number(x||0).toFixed(2)}
function subBadge(){
 const st=S.subscription?.status;
 if(st==='approved')return '<span class="badge ok">✓ Subscription Active</span>';
 if(st==='pending')return '<span class="badge wait">Payment Verification Pending</span>';
 if(st==='rejected')return '<span class="badge bad">Subscription Needs Attention</span>';
 return '<span class="badge info">Free Sample Access</span>';
}
async function boot(){
 try{
  const d=await api('bootstrap');S.settings=d.settings;S.student=d.student||null;S.subscription=d.subscription||null;S.courses=d.courses||[];
  if(S.student&&localStorage.getItem('qz_active_attempt')){await resumeLocal();if(S.attempt)return}
  home();
 }catch(e){S.token='';localStorage.removeItem('qz_student_token');localStorage.removeItem('qz_active_attempt');const d=await api('bootstrap');S.settings=d.settings;S.courses=d.courses||[];home()}
}
function home(){
 const studentBox=S.student?'<div class="welcome-card"><div class="flex"><div><div class="tiny">SIGNED IN AS</div><h2 class="section-title">'+esc(S.student.full_name)+'</h2><p class="sub">'+esc(S.student.phone)+'</p></div><div class="spacer"></div>'+subBadge()+'</div><div class="flex" style="margin-top:14px"><button class="btn primary" onclick="showProgress()">View My Progress</button>'+(S.subscription?.status==='approved'?'':'<button class="btn gold" onclick="showSubscribe()">Subscribe / Verify Payment</button>')+'</div></div>':'<div class="welcome-card"><h2 class="section-title">Start practising immediately</h2><p class="sub">Create a simple student profile with your name, phone number and a private PIN. The free sample quizzes do not require payment.</p><div class="flex" style="margin-top:14px"><button class="btn primary" onclick="showRegister()">Create Student Profile</button><button class="btn ghost" onclick="showLogin()">I Already Have an Account</button></div></div>';
 const subBox='<div class="welcome-card"><div class="tiny">FULL ACCESS</div><h2 class="section-title">'+money(S.settings?.subscription_fee)+'</h2><p class="sub">One subscription unlocks the available full practice quizzes across all three courses after admin approval.</p><div class="alert info">MoMo: <b>'+esc(S.settings?.momo_number)+'</b> • '+esc(S.settings?.contact_name)+'</div><button class="btn green" onclick="whatsappSubscribe()">Contact on WhatsApp</button></div>';
 shell('<main class="main"><section class="welcome">'+studentBox+subBox+'</section><section class="panel"><h2 class="section-title">Choose a Course</h2><p class="sub">Each full practice attempt selects 20 questions randomly and gives you 30 minutes. Sample quizzes contain 10 questions.</p><div class="course-grid">'+S.courses.map((c,i)=>'<article class="course-card"><div class="course-icon">'+esc(c.icon||'📘')+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.description||'')+'</p><button class="btn" onclick="openCourse(\''+c.slug+'\')">Open '+esc(c.short_code)+'</button></article>').join('')+'</div></section></main>');
}
function showRegister(){
 shell('<main class="main"><section class="panel" style="max-width:650px;margin:auto"><h2 class="section-title">Create Student Profile</h2><p class="sub">Your PIN lets you return on another device and continue seeing your progress.</p><div class="form-grid" style="margin-top:15px"><div class="field"><label>Full name</label><input id="regName" autocomplete="name"></div><div class="field"><label>Phone number</label><input id="regPhone" inputmode="tel" placeholder="0248..."></div><div class="field"><label>Create 4–6 digit PIN</label><input id="regPin" type="password" inputmode="numeric" maxlength="6"></div><div class="field"><label>Confirm PIN</label><input id="regPin2" type="password" inputmode="numeric" maxlength="6"></div></div><div id="regMsg"></div><div class="flex" style="margin-top:15px"><button class="btn ghost" onclick="home()">Back</button><div class="spacer"></div><button class="btn primary" onclick="registerStudent()">Create Profile</button></div></section></main>');
}
async function registerStudent(){
 const n=$('#regName').value,p=$('#regPhone').value,pin=$('#regPin').value,p2=$('#regPin2').value,m=$('#regMsg');if(pin!==p2){m.innerHTML='<div class="alert err">PINs do not match.</div>';return}
 try{const d=await api('register',{full_name:n,phone:p,pin});S.token=d.session_token;localStorage.setItem('qz_student_token',S.token);await refresh();home()}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}
}
function showLogin(){
 shell('<main class="main"><section class="panel" style="max-width:560px;margin:auto"><h2 class="section-title">Student Login</h2><p class="sub">Use the phone number and PIN you created.</p><div class="field" style="margin-top:15px"><label>Phone number</label><input id="loginPhone" inputmode="tel"></div><div class="field" style="margin-top:10px"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="6"></div><div id="loginMsg"></div><div class="flex" style="margin-top:15px"><button class="btn ghost" onclick="home()">Back</button><div class="spacer"></div><button class="btn primary" onclick="loginStudent()">Login</button></div></section></main>');
}
async function loginStudent(){const m=$('#loginMsg');try{const d=await api('login',{phone:$('#loginPhone').value,pin:$('#loginPin').value});S.token=d.session_token;localStorage.setItem('qz_student_token',S.token);await refresh();home()}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}}
async function refresh(){const d=await api('bootstrap');S.settings=d.settings;S.student=d.student||null;S.subscription=d.subscription||null;S.courses=d.courses||[]}
function showProfile(){
 if(!S.student)return showLogin();
 shell('<main class="main"><section class="panel" style="max-width:700px;margin:auto"><div class="flex"><div><h2 class="section-title">My Account</h2><p class="sub">'+esc(S.student.full_name)+' • '+esc(S.student.phone)+'</p></div><div class="spacer"></div>'+subBadge()+'</div>'+(S.subscription?'<div class="alert info">Subscription: <b>'+esc(S.subscription.status.toUpperCase())+'</b>'+(S.subscription.approved_at?' • Approved '+new Date(S.subscription.approved_at).toLocaleString():'')+'</div>':'<div class="alert warn">You currently have free sample access only.</div>')+'<div class="flex"><button class="btn gold" onclick="showSubscribe()">Subscription</button><button class="btn ghost" onclick="studentLogout()">Sign Out</button></div></section></main>');
}
async function studentLogout(){try{await api('logout')}catch(e){}S.token='';S.student=null;S.subscription=null;localStorage.removeItem('qz_student_token');await refresh();home()}
function whatsappSubscribe(){
 const fee=money(S.settings?.subscription_fee),name=S.student?.full_name||'';
 const msg=encodeURIComponent('Hello '+(S.settings?.contact_name||'Sir Isaac')+', I want to subscribe to the Quiz Practice Hub for '+fee+'. My name is '+name+'. Please assist me with activation.');
 window.open('https://wa.me/'+(S.settings?.whatsapp_number||'233248481762')+'?text='+msg,'_blank');
}
function showSubscribe(){
 if(!S.student)return showRegister();
 shell('<main class="main"><section class="panel" style="max-width:720px;margin:auto"><h2 class="section-title">Full Quiz Subscription</h2><p class="sub">Pay '+money(S.settings.subscription_fee)+' to MTN MoMo <b>'+esc(S.settings.momo_number)+'</b>. Then submit your request below. The administrator will approve your access after verification.</p><div class="alert info"><b>Step 1:</b> Make payment to '+esc(S.settings.contact_name)+'.<br><b>Step 2:</b> Tap WhatsApp to notify him.<br><b>Step 3:</b> Submit the optional MoMo reference below.<br><b>Step 4:</b> Once approved, all available full quizzes unlock automatically.</div><div class="field"><label>MoMo transaction/reference (optional)</label><input id="momoRef" placeholder="Reference or transaction ID"></div><div id="subMsg"></div><div class="flex" style="margin-top:15px"><button class="btn green" onclick="whatsappSubscribe()">WhatsApp '+esc(S.settings.contact_name)+'</button><div class="spacer"></div><button class="btn primary" onclick="requestSub()">Submit Subscription Request</button></div></section></main>');
}
async function requestSub(){const m=$('#subMsg');try{await api('request_subscription',{momo_reference:$('#momoRef').value});await refresh();m.innerHTML='<div class="alert ok">Request submitted. Your status is now pending verification.</div>';setTimeout(showProfile,900)}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}}
function openCourse(slug){
 const c=S.courses.find(x=>x.slug===slug);if(!c)return;S.course=c;
 if(!S.student){showCourseGuest(c);return}
 renderCourse(c);
}
function showCourseGuest(c){shell('<main class="main"><section class="panel"><h2 class="section-title">'+esc(c.title)+'</h2><p class="sub">Sign in or create a student profile to attempt the free sample and save your progress.</p><div class="flex" style="margin-top:15px"><button class="btn primary" onclick="showRegister()">Create Profile</button><button class="btn ghost" onclick="showLogin()">Login</button></div></section></main>')}
function renderCourse(c){
 const qs=c.quizzes||[];
 shell('<main class="main"><section class="panel"><div class="flex"><div><div class="tiny">'+esc(c.short_code)+'</div><h2 class="section-title">'+esc(c.title)+'</h2><p class="sub">'+esc(c.description||'')+'</p></div><div class="spacer"></div>'+subBadge()+'</div><div class="quiz-list">'+(qs.length?qs.map(q=>'<div class="quiz-item '+(q.locked?'locked':'')+'"><div><h4>'+esc(q.title)+(q.is_sample?' <span class="badge ok">FREE SAMPLE</span>':'')+'</h4><p class="sub">'+esc(q.description||'')+'</p><div class="meta"><span>'+q.question_bank_count+' questions in bank</span><span>'+q.questions_per_attempt+' per attempt</span><span>'+q.duration_minutes+' minutes</span><span>Code: '+esc(q.quiz_code)+'</span></div></div><div>'+(q.locked?'<button class="btn gold" onclick="showSubscribe()">🔒 Subscribe to Unlock</button>':'<button class="btn primary" '+(q.question_bank_count<1?'disabled':'')+' onclick="startQuiz(\''+q.id+'\')">'+(q.is_sample?'Try Free Sample':'Start Random Quiz')+'</button>')+'</div></div>').join(''):'<div class="alert warn">No quiz has been added to this course yet.</div>')+'</div></section></main>');
}
async function startQuiz(id){
 if(!S.student)return showLogin();
 try{const d=await api('start_quiz',{quiz_id:id});S.attempt=d.attempt;S.answers=d.attempt.answers||{};localStorage.setItem('qz_active_attempt',d.attempt.id);renderAttempt()}catch(e){alert(e.message);await refresh();if(S.course)renderCourse(S.courses.find(x=>x.slug===S.course.slug)||S.course)}
}
function renderAttempt(){
 const a=S.attempt;if(!a)return home();clearInterval(S.timer);
 $('#root').innerHTML='<div class="timerbar"><div class="timerinner"><b>'+esc(a.course_title)+' — '+esc(a.quiz_title)+'</b><div class="spacer"></div><span id="answeredCount">0/'+a.questions.length+' answered</span><div id="timer" class="timer">--:--</div><button class="btn gold small" onclick="submitQuiz(false)">Submit</button></div></div><main class="quizstage">'+a.questions.map((q,i)=>'<section class="qcard" id="q'+(i+1)+'"><div class="qhead"><span class="qnum">QUESTION '+(i+1)+'</span><span class="qtopic">'+esc(q.topic||'')+(q.difficulty?' • '+esc(q.difficulty):'')+'</span></div><div class="qtext">'+esc(q.stem)+'</div><div class="choices">'+q.options.map((o,j)=>'<div class="choice '+(Number(S.answers[q.id])===j?'selected':'')+'" onclick="choose(\''+q.id+'\','+j+',this)"><span class="letter">'+letters[j]+'</span><div>'+esc(o)+'</div></div>').join('')+'</div></section>').join('')+'</main>';
 updateAnswered();typeset();tick();S.timer=setInterval(tick,1000);
}
function choose(qid,j,el){S.answers[qid]=j;el.parentElement.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');updateAnswered();debounceSave()}
function updateAnswered(){const n=Object.keys(S.answers).filter(k=>S.answers[k]!==undefined&&S.answers[k]!==null).length;const e=$('#answeredCount');if(e)e.textContent=n+'/'+(S.attempt?.questions.length||0)+' answered'}
let saveTimer;function debounceSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>api('save_answers',{attempt_id:S.attempt.id,answers:S.answers}).catch(()=>{}),500)}
function tick(){
 if(!S.attempt)return;const left=Math.max(0,Math.floor((new Date(S.attempt.expires_at).getTime()-Date.now())/1000));const m=Math.floor(left/60),s=left%60,e=$('#timer');if(e){e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');e.classList.toggle('danger',left<=300)}if(left<=0){clearInterval(S.timer);submitQuiz(true)}
}
async function submitQuiz(auto){
 if(!S.attempt)return;if(!auto&&!confirm('Submit this quiz now? You will see your score immediately.'))return;
 try{const d=await api('submit_quiz',{attempt_id:S.attempt.id,answers:S.answers});clearInterval(S.timer);localStorage.removeItem('qz_active_attempt');S.result=d.result;S.attempt=null;renderResult()}catch(e){alert(e.message)}
}
function renderResult(){
 const r=S.result;if(!r)return home();const p=Number(r.percentage||0).toFixed(1);
 shell('<main class="main"><section class="panel"><div class="flex"><div><h2 class="section-title">Marked Script</h2><p class="sub">'+esc(r.course_title)+' • '+esc(r.quiz_title)+' • '+new Date(r.submitted_at).toLocaleString()+'</p></div><div class="spacer"></div><button class="btn no-print" onclick="window.print()">Print / Save Marked Script</button></div><div class="scorebox"><div class="scorecircle">'+r.score+'/'+r.total+'</div><div><h2 style="margin:0;font-size:34px;color:var(--navy)">'+p+'%</h2><p class="sub">'+(r.timed_out?'Time elapsed — available answers were marked.':'Submitted successfully and marked instantly.')+'</p></div></div>'+r.marked.map((q,i)=>'<div class="script '+(q.correct?'correct':'wrong')+'"><div class="qhead"><span class="qnum">QUESTION '+(i+1)+'</span><span class="qtopic">'+(q.correct?'✓ Correct':'✗ Incorrect')+'</span></div><div class="qtext">'+esc(q.stem)+'</div><div style="margin-top:10px">'+q.options.map((o,j)=>'<div class="script-option '+(q.selected_index===j?'mine ':'')+(q.correct_index===j?'right':'')+'"><b>'+letters[j]+'.</b> '+esc(o)+(q.selected_index===j?' <b>← Your answer</b>':'')+(q.correct_index===j?' <b>← Correct answer</b>':'')+'</div>').join('')+'</div>'+(q.explanation?'<div class="alert info"><b>Explanation:</b> '+esc(q.explanation)+'</div>':'')+'</div>').join('')+'</section></main>');typeset();
}
async function showProgress(){
 if(!S.student)return showLogin();
 try{const d=await api('progress');renderProgress(d)}catch(e){alert(e.message)}
}
function renderProgress(d){
 const overall=d.overall||{attempts:0,average:0,best:0};const cards=(d.by_course||[]).map(x=>'<div class="progress-card"><div class="tiny">'+esc(x.short_code)+'</div><h3 style="margin:5px 0;color:var(--navy)">'+esc(x.title)+'</h3><b style="font-size:27px">'+Number(x.average).toFixed(1)+'%</b><div class="bar"><span style="width:'+Math.min(100,Number(x.average))+'%"></span></div><p class="tiny">'+x.attempts+' attempts • Best '+Number(x.best).toFixed(1)+'%</p></div>').join('');
 shell('<main class="main"><section class="panel"><div class="flex"><div><h2 class="section-title">My Learning Progress</h2><p class="sub">Compare your performance across all three courses.</p></div><div class="spacer"></div><button class="btn no-print" onclick="window.print()">Print Progress</button></div><div class="stat-grid"><div class="stat"><span>Total Attempts</span><b>'+overall.attempts+'</b></div><div class="stat"><span>Overall Average</span><b>'+Number(overall.average).toFixed(1)+'%</b></div><div class="stat"><span>Best Score</span><b>'+Number(overall.best).toFixed(1)+'%</b></div><div class="stat"><span>Subscription</span><b style="font-size:16px">'+(S.subscription?.status||'sample only')+'</b></div></div><div class="progress-grid">'+cards+'</div><h3 style="margin-top:22px">Recent Attempts</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Course</th><th>Quiz</th><th>Score</th><th>%</th><th></th></tr></thead><tbody>'+(d.attempts||[]).map(a=>'<tr><td>'+new Date(a.submitted_at).toLocaleString()+'</td><td>'+esc(a.course_title)+'</td><td>'+esc(a.quiz_title)+'</td><td>'+a.score+'/'+a.total+'</td><td><b>'+Number(a.percentage).toFixed(1)+'%</b></td><td><button class="btn small ghost no-print" onclick="viewAttempt(\''+a.id+'\')">Marked Script</button></td></tr>').join('')+'</tbody></table></div></section></main>');
}
async function viewAttempt(id){try{const d=await api('attempt_result',{attempt_id:id});S.result=d.result;renderResult()}catch(e){alert(e.message)}}
function showAdmin(){
 if(S.adminPw){loadAdmin();return}
 shell('<main class="main"><section class="panel" style="max-width:520px;margin:auto"><h2 class="section-title">Administrator Login</h2><p class="sub">Enter the administrator passcode to manage subscriptions, quizzes and analytics.</p><div class="field" style="margin-top:14px"><label>Admin passcode</label><input id="adminPw" type="password" inputmode="numeric"></div><div id="adminMsg"></div><div class="flex" style="margin-top:14px"><button class="btn ghost" onclick="home()">Back</button><div class="spacer"></div><button class="btn dark" onclick="adminLogin()">Open Control Room</button></div></section></main>');
}
async function adminLogin(){const m=$('#adminMsg');try{await api('admin_login',{password:$('#adminPw').value});S.adminPw=$('#adminPw').value;sessionStorage.setItem('qz_admin_pw',S.adminPw);loadAdmin()}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}}
async function loadAdmin(){try{const d=await api('admin_dashboard',{password:S.adminPw});S.admin=d;renderAdmin('overview')}catch(e){S.adminPw='';sessionStorage.removeItem('qz_admin_pw');showAdmin()}}
function adminNav(active){
 return '<div class="tabs no-print">'+[['overview','Overview'],['subscriptions','Subscriptions'],['quizzes','Quiz Manager'],['settings','Settings']].map(x=>'<button class="tab '+(active===x[0]?'active':'')+'" onclick="renderAdmin(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<button class="tab" onclick="adminLogout()">Logout</button></div>';
}
function renderAdmin(tab){
 if(!S.admin)return loadAdmin();const a=S.admin;
 let body='';if(tab==='overview')body=adminOverview(a);if(tab==='subscriptions')body=adminSubscriptions(a);if(tab==='quizzes')body=adminQuizzes(a);if(tab==='settings')body=adminSettings(a);
 shell('<main class="main"><section class="panel"><div class="flex"><div><h2 class="section-title">Admin Control Room</h2><p class="sub">Manage paid access, quiz banks, settings and student performance.</p></div><div class="spacer"></div><button class="btn primary no-print" onclick="loadAdmin()">Refresh</button></div>'+adminNav(tab)+body+'</section></main>');
}
function adminOverview(a){
 return '<div class="stat-grid"><div class="stat"><span>Students</span><b>'+a.stats.students+'</b></div><div class="stat"><span>Approved</span><b>'+a.stats.approved+'</b></div><div class="stat"><span>Pending</span><b>'+a.stats.pending+'</b></div><div class="stat"><span>Submitted Attempts</span><b>'+a.stats.attempts+'</b></div></div><div class="flex no-print"><button class="btn green" onclick="approveAllPending()">Approve All Pending</button><button class="btn ghost" onclick="window.print()">Print Dashboard</button></div><h3>Recent Performance</h3><div class="tablewrap"><table><thead><tr><th>Student</th><th>Course</th><th>Quiz</th><th>Score</th><th>Date</th></tr></thead><tbody>'+a.recent_attempts.map(x=>'<tr><td>'+esc(x.student_name)+'<br><small>'+esc(x.phone)+'</small></td><td>'+esc(x.course_title)+'</td><td>'+esc(x.quiz_title)+'</td><td><b>'+Number(x.percentage).toFixed(1)+'%</b></td><td>'+new Date(x.submitted_at).toLocaleString()+'</td></tr>').join('')+'</tbody></table></div>';
}
function adminSubscriptions(a){
 const rows=a.subscriptions||[];
 return '<div class="flex no-print"><button class="btn green" onclick="approveAllPending()">Approve All Pending</button><button class="btn ghost" onclick="window.print()">Print Subscription List</button></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Phone</th><th>Status</th><th>Amount</th><th>Reference</th><th>Requested</th><th class="no-print">Action</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.full_name)+'</b></td><td>'+esc(x.phone)+'</td><td><span class="badge '+(x.status==='approved'?'ok':x.status==='pending'?'wait':'bad')+'">'+esc(x.status.toUpperCase())+'</span></td><td>'+money(x.amount)+'</td><td>'+esc(x.momo_reference||'—')+'</td><td>'+new Date(x.requested_at).toLocaleString()+'</td><td class="no-print"><div class="flex"><button class="btn small green" onclick="setSub(\''+x.student_id+'\',\'approved\')">Approve</button><button class="btn small red" onclick="setSub(\''+x.student_id+'\',\'rejected\')">Reject</button></div></td></tr>').join('')+'</tbody></table></div>';
}
async function setSub(id,status){if(!confirm((status==='approved'?'Approve':'Reject')+' this subscription?'))return;try{await api('admin_set_subscription',{password:S.adminPw,student_id:id,status});await loadAdmin();renderAdmin('subscriptions')}catch(e){alert(e.message)}}
async function approveAllPending(){if(!confirm('Approve ALL pending subscription requests at once?'))return;try{const d=await api('admin_approve_all',{password:S.adminPw});alert(d.approved+' pending subscription(s) approved.');await loadAdmin()}catch(e){alert(e.message)}}
function adminQuizzes(a){
 return '<div class="alert info">Full quizzes default to <b>20 random questions in 30 minutes</b>. A quiz can contain a much larger question bank; each attempt draws a fresh random set.</div><div class="tablewrap"><table><thead><tr><th>Course</th><th>Quiz</th><th>Code</th><th>Bank</th><th>Per Attempt</th><th>Time</th><th>Status</th><th class="no-print">Actions</th></tr></thead><tbody>'+a.quizzes.map(q=>'<tr><td>'+esc(q.course_title)+'</td><td><b>'+esc(q.title)+'</b>'+(q.is_sample?' <span class="badge ok">Sample</span>':'')+'</td><td>'+esc(q.quiz_code)+'</td><td>'+q.question_bank_count+'</td><td>'+q.questions_per_attempt+'</td><td>'+q.duration_minutes+' min</td><td>'+ (q.active?'Active':'Hidden') +'</td><td class="no-print"><div class="flex"><button class="btn small ghost" onclick="toggleQuiz(\''+q.id+'\','+(!q.active)+')">'+(q.active?'Hide':'Activate')+'</button>'+(!q.is_sample?'<button class="btn small red" onclick="deleteQuiz(\''+q.id+'\')">Delete</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>';
}
async function toggleQuiz(id,val){try{await api('admin_toggle_quiz',{password:S.adminPw,quiz_id:id,active:val});await loadAdmin();renderAdmin('quizzes')}catch(e){alert(e.message)}}
async function deleteQuiz(id){if(!confirm('Delete this quiz and its question bank? Existing attempt records linked to it will also be removed.'))return;try{await api('admin_delete_quiz',{password:S.adminPw,quiz_id:id});await loadAdmin();renderAdmin('quizzes')}catch(e){alert(e.message)}}
const COURSE_SLUGS=['statistical-methods-1','ordinary-differential-equation','advanced-calculus-2'];
function importPrompt(){
 const slug=$('#promptCourse')?.value||COURSE_SLUGS[0];
 return 'Create a multiple-choice quiz import for my Sir Isaac Quiz Practice Hub.\\n\\nRETURN ONLY VALID JSON. Do not use Markdown code fences and do not add comments before or after the JSON.\\n\\nUse EXACTLY this structure:\\n{\\n  "format_version": "sir-isaac-quiz-v1",\\n  "course_slug": "'+slug+'",\\n  "quiz": {\\n    "quiz_code": "UNIQUE-CODE-HERE",\\n    "title": "Practice Quiz Title",\\n    "description": "Short description",\\n    "questions_per_attempt": 20,\\n    "duration_minutes": 30,\\n    "active": true\\n  },\\n  "questions": [\\n    {\\n      "question_no": 1,\\n      "topic": "Topic name",\\n      "difficulty": "Easy|Medium|Hard",\\n      "question": "Complete question text",\\n      "options": ["Option A","Option B","Option C","Option D"],\\n      "answer": 0,\\n      "explanation": "Clear reason the correct answer is right."\\n    }\\n  ]\\n}\\n\\nSTRICT RULES:\\n1. course_slug must remain exactly "'+slug+'".\\n2. Generate as many questions as I request, but never fewer than 20 for a full quiz.\\n3. Every question must have EXACTLY four options.\\n4. answer is the zero-based index of the correct option: 0=A, 1=B, 2=C, 3=D.\\n5. question_no must start at 1 and increase by 1 without gaps.\\n6. quiz_code must be unique and contain only letters, numbers, hyphens or underscores.\\n7. For mathematical notation, use readable Unicode or LaTeX inside strings. Escape every JSON backslash correctly (for example "\\\\\\\\frac{1}{2}" in JSON text when needed).\\n8. Do not include the answer in the question text or option labels.\\n9. Explanations must be concise but sufficient for learning.\\n10. Output must parse with JSON.parse() without any correction.\\n11. Do not place A., B., C., D. inside option strings; the application adds option letters automatically.\\n12. The application will randomly select 20 questions from the bank for each full attempt and use 30 minutes unless the quiz settings above are deliberately changed.';
}
function adminImport(){
 return '<div class="alert info"><b>Step 1:</b> Copy the AI instructions below and paste them into ChatGPT or another AI. <b>Step 2:</b> Ask it to generate your required questions. <b>Step 3:</b> copy the returned JSON here or upload the .json file. <b>Step 4:</b> validate and import.</div><div class="form-grid"><div class="field"><label>Course for AI instruction</label><select id="promptCourse">'+COURSE_SLUGS.map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="field"><label>Import JSON file</label><input type="file" id="quizFile" accept=".json,application/json" onchange="loadQuizFile(this)"></div></div><div class="flex" style="margin:12px 0"><button class="btn primary" onclick="copyInstructions()">Copy Quiz-Generation Instructions</button><button class="btn ghost" onclick="showInstructions()">Preview Instructions</button></div><div class="field"><label>Paste generated quiz JSON</label><textarea id="importBox" placeholder="{ ... }"></textarea></div><div id="importMsg"></div><div class="flex" style="margin-top:12px"><button class="btn ghost" onclick="validateImport()">Validate Only</button><div class="spacer"></div><button class="btn green" onclick="doImport()">Validate & Import Quiz</button></div>';
}
async function copyInstructions(){try{await navigator.clipboard.writeText(importPrompt());alert('Quiz-generation instructions copied. Paste them into your AI.')}catch(e){alert(importPrompt())}}
function showInstructions(){alert(importPrompt())}
function loadQuizFile(inp){const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#importBox').value=r.result};r.readAsText(f)}
function parseImport(){const p=JSON.parse($('#importBox').value);if(p.format_version!=='sir-isaac-quiz-v1')throw new Error('format_version must be sir-isaac-quiz-v1');if(!COURSE_SLUGS.includes(p.course_slug))throw new Error('Invalid course_slug.');if(!p.quiz?.quiz_code||!p.quiz?.title)throw new Error('quiz_code and quiz title are required.');if(!Array.isArray(p.questions)||!p.questions.length)throw new Error('questions array is empty.');const needed=Math.max(1,Number(p.quiz?.questions_per_attempt||20));if(p.questions.length<needed)throw new Error('Quiz bank has '+p.questions.length+' questions; at least '+needed+' are required.');p.questions.forEach((q,i)=>{if(!Array.isArray(q.options)||q.options.length!==4)throw new Error('Question '+(i+1)+' must have exactly four options.');if(![0,1,2,3].includes(Number(q.answer)))throw new Error('Question '+(i+1)+' has invalid answer index.');});return p}
function validateImport(){const m=$('#importMsg');try{const p=parseImport();m.innerHTML='<div class="alert ok">Valid import: <b>'+esc(p.quiz.title)+'</b> with '+p.questions.length+' questions for '+esc(p.course_slug)+'.</div>'}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}}
async function doImport(){const m=$('#importMsg');try{const p=parseImport();if(!confirm('Import "'+p.quiz.title+'" with '+p.questions.length+' questions? Existing quiz with the same code will be replaced.'))return;const d=await api('admin_import_quiz',{password:S.adminPw,payload:p});m.innerHTML='<div class="alert ok">Imported successfully: '+esc(d.title)+' • '+d.questions+' questions.</div>';$('#importBox').value='';await loadAdmin()}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}}
function adminSettings(a){
 const s=a.settings;return '<div class="form-grid"><div class="field"><label>Application title</label><input id="setTitle" value="'+esc(s.app_title)+'"></div><div class="field"><label>Subscription fee (GH₵)</label><input id="setFee" type="number" min="0" step="0.01" value="'+Number(s.subscription_fee)+'"></div><div class="field"><label>MTN MoMo number</label><input id="setMomo" value="'+esc(s.momo_number)+'"></div><div class="field"><label>WhatsApp number (international digits)</label><input id="setWa" value="'+esc(s.whatsapp_number)+'"></div><div class="field"><label>Contact name</label><input id="setContact" value="'+esc(s.contact_name)+'"></div><div class="field"><label>New admin passcode (leave blank to keep current)</label><input id="setPw" type="password" inputmode="numeric"></div></div><div id="setMsg"></div><button class="btn primary" style="margin-top:14px" onclick="saveSettings()">Save Settings</button>';
}
async function saveSettings(){const m=$('#setMsg');try{const newPw=$('#setPw').value;await api('admin_update_settings',{password:S.adminPw,app_title:$('#setTitle').value,subscription_fee:$('#setFee').value,momo_number:$('#setMomo').value,whatsapp_number:$('#setWa').value,contact_name:$('#setContact').value,new_password:newPw});if(newPw){S.adminPw=newPw;sessionStorage.setItem('qz_admin_pw',newPw)}m.innerHTML='<div class="alert ok">Settings saved.</div>';await refresh();await loadAdmin()}catch(e){m.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'}}
function adminLogout(){S.adminPw='';S.admin=null;sessionStorage.removeItem('qz_admin_pw');home()}
async function resumeLocal(){
 const id=localStorage.getItem('qz_active_attempt');if(!id||!S.student)return;
 try{const d=await api('resume_attempt',{attempt_id:id});if(d.attempt){S.attempt=d.attempt;S.answers=d.attempt.answers||{};renderAttempt()}}catch(e){localStorage.removeItem('qz_active_attempt')}
}
boot();
</script>
</body></html>
