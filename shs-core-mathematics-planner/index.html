<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHS Core Mathematics Lesson Planner</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#0c3026,#164d3d);color:#fff;min-height:100vh;display:grid;place-items:center;font:15px/1.55 system-ui,sans-serif;padding:20px}.loader{width:min(570px,100%);background:#fff;color:#15372d;border-radius:23px;padding:30px;box-shadow:0 22px 70px #00180e55;text-align:center}.mark{font:700 44px Georgia,serif;color:#c39333}.loader h1{font:750 clamp(24px,5vw,35px)/1.15 Georgia,serif;margin:8px 0}.loader p{color:#50665e;margin:12px auto}.track{background:#e3eee8;border-radius:99px;height:10px;overflow:hidden;margin:20px 0 9px}.fill{height:100%;width:0%;background:linear-gradient(90deg,#a77822,#147452);border-radius:99px;transition:width .15s}.footer{font-size:12px;color:#627b6e}.error{display:none;border:1px solid #f5c3b4;color:#982c1a;background:#fff0eb;border-radius:10px;padding:12px;margin-top:18px}.retry{display:none;border:0;border-radius:8px;background:#126448;color:#fff;padding:10px 18px;margin:12px auto;cursor:pointer}</style></head><body>
<div class="loader"><div class="mark">ℝ</div><h1>SHS Core Mathematics<br>Lesson Planner</h1><p>Mathematics Auto-Populate Machine</p><div class="track" role="progressbar" aria-label="Loading application"><div class="fill" id="fill"></div></div><div id="message">Loading teaching materials…</div><p class="footer">68 weekly packs · Prepared by Sir Isaac Boahen</p><div class="error" id="error"></div><button class="retry" id="retry">Retry loading</button></div>
<script>
(async()=>{const total=19;let done=0;const fill=document.getElementById('fill'),msg=document.getElementById('message'),error=document.getElementById('error'),retry=document.getElementById('retry');
retry.addEventListener('click',()=>location.reload());try{const files=await Promise.all(Array.from({length:total},async(_,i)=>{const id=String(i).padStart(2,'0');const r=await fetch('./parts/p'+id+'.txt?v=20261021a',{cache:'force-cache'});if(!r.ok)throw Error('A teaching-material file could not load (part '+id+').');const s=await r.text();done++;fill.style.width=Math.round(done/total*100)+'%';msg.textContent='Loading teaching materials: '+done+' of '+total;return s}));const html=files.join('');if(!html.startsWith('<!doctype html>')||!html.trimEnd().endsWith('</html>'))throw Error('The application files are incomplete.');document.open();document.write(html);document.close()}catch(e){error.style.display='block';error.textContent='Could not load the app. Check your internet connection and try again. '+e.message;retry.style.display='block';msg.textContent='Loading interrupted.'}})();
</script></body></html>
